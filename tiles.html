<style>

  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display:flex; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; min-width:0; }
  #c { max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 20px 60px #0008; background:#000; }
  aside { width:300px; flex:none; background:var(--panel); border-left:1px solid var(--line);
    overflow-y:auto; padding:18px 18px 28px; }
  .tabs { display:flex; gap:4px; background:#12121a; border:1px solid var(--line); border-radius:8px; padding:3px; margin-bottom:14px; }
  .tabs a { flex:1; text-align:center; padding:5px 0; border-radius:6px; color:var(--dim); text-decoration:none; }
  .tabs a.on { background:#2a2a38; color:var(--text); }

  .sub { color:var(--dim); margin:0 0 16px; font-size:12px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim);
    margin:20px 0 8px; font-weight:600; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .row label { flex:0 0 92px; color:var(--dim); }
  .row input[type=range] { flex:1; accent-color:var(--accent); min-width:0; }
  .row output { width:36px; text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px; }
  select, input[type=number] { background:#12121a; color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:5px 7px; font:inherit; min-width:0; }

  button { background:#262633; color:var(--text); border:1px solid var(--line); border-radius:7px;

  .btns { display:flex; gap:8px; }

<script src="pwa.js"></script>
<script>
// ---------- Palettes: [background, tiles, accent, accent light] ----------
const PALETTES = {
  "Cyan":      ["#07090c", "#5f636a", "#22cfee", "#b6f5ff"],
  "Lime":      ["#07090a", "#5c6160", "#9cff2e", "#e2ffc0"],
  "Orange":    ["#0a0806", "#64605c", "#ff7a1a", "#ffd3ad"],
  "Hot Pink":  ["#0a0609", "#635d63", "#ff2e93", "#ffbfdf"],
  "Violet":    ["#08070c", "#5f5d69", "#8f5bff", "#d9c8ff"],
  "Gold":      ["#0a0906", "#67625a", "#ffc21a", "#fff0b8"],
  "Red":       ["#0a0606", "#615b5b", "#ff2a2a", "#ffbcbc"],
  "Mint":      ["#060a09", "#5b6563", "#2effc0", "#c4fff0"],
  "Graphite":  ["#060606", "#6a6a6a", "#ffffff", "#ffffff"],
  "Concrete":  ["#3a3c40", "#c9cbcf", "#16a6e0", "#e0f6ff"],
};

const SLIDERS_TILES = [
  ["cells",     "Tiles",          6, 120, 1,   22],
  ["irregular", "Irregularity",   0,   1, 0.01, 0.8],
  ["relief",    "Relief",         0,   1, 0.01, 0.55],
  ["tilt",      "Face tilt",      0,   1, 0.01, 0.5],
  ["gap",       "Gap",            0,   1, 0.01, 0.25],
  ["sheen",     "Edge sheen",     0,   1, 0.01, 0.5],
  ["shadow",    "Shadows",        0,   1, 0.01, 0.65],
  ["light",     "Light angle",    0, 360, 1,   65],
];
const SLIDERS_GFX = [
  ["density",   "Amount",         0,   1, 0.01, 0.45],
  ["angle",     "Direction",    -90,  90, 1,  -45],
  ["bands",     "Bands",          1,   5, 1,    2],
  ["spread",    "Band spread",  0.05,  1, 0.01, 0.3],
  ["size",      "Bar size",       0,   1, 0.01, 0.5],
  ["opacity",   "Opacity",        0,   1, 0.01, 0.8],
  ["detail",    "Dots & ticks",   0,   1, 0.01, 0.5],
  ["glow",      "Glow",           0,   1, 0.01, 0.35],
  ["grain",     "Grain",          0,   1, 0.01, 0.2],
];
const SLIDERS = [...SLIDERS_TILES, ...SLIDERS_GFX];

const state = { seed: 3, palette: "Cyan", colors: [...PALETTES["Cyan"]], w: 1170, h: 2532 };
SLIDERS.forEach(([k,,,,,v]) => state[k] = v);

// ---------- Helpers ----------
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = (c, a = 1) => `rgba(${clamp(c[0],0,255)|0},${clamp(c[1],0,255)|0},${clamp(c[2],0,255)|0},${a})`;

const noise = document.createElement("canvas");
noise.width = noise.height = 256;
{ const nctx = noise.getContext("2d"), img = nctx.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255; }
  nctx.putImageData(img, 0, 0); }

// Keep the part of a convex polygon where dot(p, n) <= c.
function clipHalf(poly, n, c) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const da = a[0]*n[0] + a[1]*n[1] - c, db = b[0]*n[0] + b[1]*n[1] - c;
    if (da <= 0) out.push(a);
    if ((da < 0) !== (db < 0)) { const t = da / (da - db); out.push([a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t]); }
  }
  return out;
}

// ---------- Scene (units: 1 = image height) ----------
function generate(A) {
  const rnd = mulberry32(state.seed);
  // Jittered grid of sites, one cell of margin beyond every edge
  const cols = Math.max(2, Math.round(Math.sqrt(state.cells * A))), rows = Math.max(2, Math.round(state.cells / cols));
  const sites = [];
  for (let r = -1; r <= rows; r++) for (let c = -1; c <= cols; c++) {
    const j = [rnd(), rnd(), rnd(), rnd(), rnd()];
    sites.push({ p: [(c + 0.5 + (j[0] - 0.5) * state.irregular) / cols * A, (r + 0.5 + (j[1] - 0.5) * state.irregular) / rows],
                 h: j[2], tilt: [j[3] - 0.5, j[4] - 0.5] });
  }
  const cellSize = 1 / Math.max(rows, cols / A);
  const gap = state.gap * 0.012;
  const bound = [[-0.3*A, -0.3], [1.3*A, -0.3], [1.3*A, 1.3], [-0.3*A, 1.3]];
  const cells = [];
  for (const s of sites) {
    let poly = bound;
    for (const o of sites) {
      if (o === s) continue;
      const d = [o.p[0] - s.p[0], o.p[1] - s.p[1]], L = Math.hypot(d[0], d[1]);
      if (L > cellSize * 3.2) continue;
      const n = [d[0] / L, d[1] / L];
      const mid = [(s.p[0] + o.p[0]) / 2, (s.p[1] + o.p[1]) / 2];
      poly = clipHalf(poly, n, mid[0]*n[0] + mid[1]*n[1] - gap / 2);
      if (poly.length < 3) break;
    }
    if (poly.length >= 3) cells.push({ poly, h: s.h * state.relief * cellSize * 0.35, tilt: s.tilt, site: s.p });
  }
  cells.sort((a, b) => a.h - b.h);

  // Graphics layer: elements scattered along a few diagonal bands
  const ang = state.angle * Math.PI / 180, dir = [Math.cos(ang), -Math.sin(ang)], perp = [-dir[1], dir[0]];
  const center = [A / 2, 0.5], diag = Math.hypot(A, 1);
  const bandPos = Array.from({ length: 5 }, () => (rnd() - 0.5) * diag * 0.7);
  const gfx = [];
  for (let i = 0; i < 90; i++) {
    const r = Array.from({ length: 10 }, rnd);
    if (i >= Math.round(state.density * 90)) continue;
    const band = bandPos[(r[0] * state.bands) | 0];
    const v = band + (r[1] + r[2] + r[3] - 1.5) * state.spread * 0.4 * diag;
    const u = (r[4] - 0.5) * diag * 1.05;
    const p = [center[0] + dir[0]*u + perp[0]*v, center[1] + dir[1]*u + perp[1]*v];
    const t = r[5];
    const detail = state.detail;
    let type;
    if (t < 0.3 + 0.2 * (1 - detail)) type = "bar";
    else if (t < 0.48 + 0.1 * (1 - detail)) type = "line";
    else if (t < 0.66) type = "dots";
    else if (t < 0.78) type = "dashes";
    else if (t < 0.88) type = "ticks";
    else type = "circle";
    gfx.push({ type, p, r: r.slice(6), light: r[9] < 0.3 });
  }
  return { cells, gfx, dir, perp, ang };
}

// ---------- Rendering ----------
function render(ctx, W, H) {
  const s = H / 1080, A = W / H;
  const [bg, tile, ac, ac2] = state.colors.map(hexToRgb);
  const la = state.light * Math.PI / 180;
  const L2 = [Math.cos(la), -Math.sin(la)];
  const L3 = (() => { const v = [L2[0] * 0.7, L2[1] * 0.7, 0.75], m = Math.hypot(...v); return v.map(x => x / m); })();
  const ext = [-L2[0] * 0.35, 0.94];                 // which way the tile sides show
  const { cells, gfx, dir, ang } = generate(A);

  const reset = () => { ctx.globalCompositeOperation = "source-over"; ctx.shadowBlur = 0; ctx.shadowColor = "transparent"; ctx.globalAlpha = 1; ctx.filter = "none"; };
  const path = (pts, off = [0, 0]) => { ctx.beginPath(); pts.forEach((p, i) => { const x = (p[0] + off[0]) * H, y = (p[1] + off[1]) * H; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); };

  ctx.setTransform(1, 0, 0, 1, 0, 0); reset();
  ctx.fillStyle = rgba(bg); ctx.fillRect(0, 0, W, H);

  for (const c of cells) {
    const { poly, h } = c;
    const e = [ext[0] * h, ext[1] * h];
    // signed area tells winding, so we know which side of each edge is outside
    let area = 0; poly.forEach((a, i) => { const b = poly[(i + 1) % poly.length]; area += a[0]*b[1] - b[0]*a[1]; });
    const wind = area > 0 ? 1 : -1;

    // soft cast shadow
    if (state.shadow > 0) {
      ctx.filter = `blur(${(4 + h * 900) * s}px)`;
      path(poly, [e[0] * 1.6 - L2[0] * h * 0.8, e[1] * 1.6 - L2[1] * h * 0.8]);
      ctx.fillStyle = rgba([0, 0, 0], 0.75 * state.shadow); ctx.fill();
      ctx.filter = "none";
    }

    // side walls
    poly.forEach((a, i) => {
      const b = poly[(i + 1) % poly.length];
      const out = [(b[1] - a[1]) * wind, -(b[0] - a[0]) * wind], m = Math.hypot(...out) || 1;
      const on = [out[0] / m, out[1] / m];
      if (on[0]*ext[0] + on[1]*ext[1] <= 0 || h <= 0) return;
      const lit = clamp(0.25 + 0.35 * (on[0]*L2[0] + on[1]*L2[1]), 0.05, 0.7);
      path([a, b, [b[0] + e[0], b[1] + e[1]], [a[0] + e[0], a[1] + e[1]]]);
      ctx.fillStyle = rgba(mixc(bg, tile, lit)); ctx.fill();
    });

    // top face: tilted plane lit from the light direction, shaded across the tilt
    const tl = state.tilt * 1.2;
    const n = [-c.tilt[0] * tl, -c.tilt[1] * tl, 1], nm = Math.hypot(...n);
    const b = clamp((n[0]*L3[0] + n[1]*L3[1] + n[2]*L3[2]) / nm, 0, 1);
    const bright = 0.35 + b * 0.75;
    const tdir = Math.hypot(...c.tilt) > 0.01 ? c.tilt : [0.5, 0.5];
    const g0 = [c.site[0] - tdir[0] * 0.15, c.site[1] - tdir[1] * 0.15], g1 = [c.site[0] + tdir[0] * 0.15, c.site[1] + tdir[1] * 0.15];
    const grad = ctx.createLinearGradient(g0[0] * H, g0[1] * H, g1[0] * H, g1[1] * H);
    const top = bright > 1 ? mixc(tile, [255, 255, 255], (bright - 1) * 0.6) : mixc(bg, tile, bright);
    grad.addColorStop(0, rgba(mixc(top, [255, 255, 255], 0.06)));
    grad.addColorStop(1, rgba(mixc(top, bg, 0.3)));
    path(poly); ctx.fillStyle = grad; ctx.fill();

    // bevel: bright edges facing the light, dark ones facing away
    if (state.sheen > 0) {
      ctx.lineWidth = 1.4 * s; ctx.lineJoin = "round";
      poly.forEach((a, i) => {
        const bb = poly[(i + 1) % poly.length];
        const out = [(bb[1] - a[1]) * wind, -(bb[0] - a[0]) * wind], m = Math.hypot(...out) || 1;
        const f = (out[0]*L2[0] + out[1]*L2[1]) / m;
        ctx.beginPath(); ctx.moveTo(a[0] * H, a[1] * H); ctx.lineTo(bb[0] * H, bb[1] * H);
        ctx.strokeStyle = f > 0 ? rgba([255, 255, 255], 0.35 * f * state.sheen) : rgba([0, 0, 0], -0.5 * f * state.sheen);
        ctx.stroke();
      });
    }
  }
  reset();

  // Graphics layer, drawn in image-height units
  ctx.setTransform(H, 0, 0, H, 0, 0);
  ctx.lineCap = "round";
  const op = state.opacity;
  const glow = (col) => { ctx.shadowColor = rgba(col, 0.9); ctx.shadowBlur = state.glow * 30 * s; };
  for (const g of gfx) {
    const col = g.light ? ac2 : ac;
    const [p0, p1, p2, p3] = g.r;
    ctx.save();
    ctx.translate(g.p[0], g.p[1]);
    glow(col);
    if (g.type === "bar") {
      const len = 0.06 + p0 * 0.3 * (0.5 + state.size), wid = (0.008 + p1 * 0.035) * (0.4 + state.size * 1.2);
      ctx.rotate(-ang);
      ctx.beginPath(); ctx.moveTo(-len / 2, 0); ctx.lineTo(len / 2, 0);
      ctx.strokeStyle = rgba(col, op * (0.45 + p2 * 0.5)); ctx.lineWidth = wid; ctx.stroke();
    } else if (g.type === "line") {
      const len = 0.15 + p0 * 0.5;
      ctx.rotate(-ang);
      ctx.beginPath(); ctx.moveTo(-len / 2, 0); ctx.lineTo(len / 2, 0);
      ctx.strokeStyle = rgba(col, op * (0.4 + p2 * 0.4)); ctx.lineWidth = 0.0012 + p1 * 0.002; ctx.stroke();
    } else if (g.type === "dots") {
      const nx = 4 + (p0 * 9 | 0), ny = 2 + (p1 * 5 | 0), sp = 0.011 + p2 * 0.01, rad = sp * 0.17;
      ctx.rotate(-ang);
      ctx.fillStyle = rgba(col, op * 0.75);
      for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
        ctx.beginPath(); ctx.arc((i - nx / 2) * sp, (j - ny / 2) * sp, rad, 0, Math.PI * 2); ctx.fill();
      }
    } else if (g.type === "dashes") {
      const n = 4 + (p0 * 8 | 0), sq = 0.005 + p1 * 0.005, sp = sq * 2.6;
      ctx.rotate(-ang);
      ctx.fillStyle = rgba(col, op * 0.85);
      for (let i = 0; i < n; i++) { ctx.save(); ctx.translate((i - n / 2) * sp, 0); ctx.rotate(ang); ctx.fillRect(-sq / 2, -sq / 2, sq, sq); ctx.restore(); }
    } else if (g.type === "ticks") {
      const n = 4 + (p0 * 9 | 0), sp = 0.01 + p1 * 0.008, len = 0.04 + p2 * 0.08;
      ctx.strokeStyle = rgba(col, op * 0.6); ctx.lineWidth = 0.0015;
      for (let i = 0; i < n; i++) {
        const x = (i - n / 2) * sp, yo = Math.sin(i * 1.7 + p3 * 6) * len * 0.15;
        ctx.beginPath(); ctx.moveTo(x, -len / 2 + yo); ctx.lineTo(x, len / 2 + yo); ctx.stroke();
      }
    } else {
      ctx.beginPath(); ctx.arc(0, 0, 0.006 + p0 * 0.014 * (0.5 + state.size), 0, Math.PI * 2);
      ctx.fillStyle = rgba(col, op * (0.6 + p1 * 0.4)); ctx.fill();
    }
    ctx.restore();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); reset();

  // Vignette + grain
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.5)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (state.grain > 0) {
    ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = state.grain * 0.35;
    ctx.fillStyle = ctx.createPattern(noise, "repeat"); ctx.fillRect(0, 0, W, H);
    reset();
  }
}

// ---------- Preview ----------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
function draw() {
  const stage = document.getElementById("stage");
  const [maxW, maxH] = stageBox(stage);
  const sc = Math.min(maxW / state.w, maxH / state.h);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = Math.round(state.w * sc) + "px";
  canvas.style.height = Math.round(state.h * sc) + "px";
  canvas.width = Math.max(1, Math.round(state.w * sc * dpr));
  canvas.height = Math.max(1, Math.round(state.h * sc * dpr));
  render(ctx, canvas.width, canvas.height);
}
let pending = false;
const schedule = () => { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; draw(); }); } };

// ---------- UI ----------
const $ = id => document.getElementById(id);
const fmt = (v, step) => step >= 1 ? String(Math.round(v)) : v.toFixed(2);
const sliderEls = {};
[[SLIDERS_TILES, "sliders-tiles"], [SLIDERS_GFX, "sliders-gfx"]].forEach(([list, host]) => list.forEach(([key, label, min, max, step]) => {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}"><output></output>`;
  const input = row.querySelector("input"), out = row.querySelector("output");
  input.addEventListener("input", () => { state[key] = +input.value; out.textContent = fmt(+input.value, step); schedule(); });
  sliderEls[key] = { input, out, step };
  $(host).appendChild(row);
}));

Object.keys(PALETTES).forEach(name => $("palette").add(new Option(name, name)));
$("palette").add(new Option("Custom", "Custom"));
const colorEls = state.colors.map((_, i) => {
  const el = document.createElement("input"); el.type = "color";
  el.addEventListener("input", () => { state.colors[i] = el.value; state.palette = "Custom"; $("palette").value = "Custom"; schedule(); });
  $("swatches").appendChild(el); return el;
});

function syncUI() {
  SLIDERS.forEach(([k]) => { const s = sliderEls[k]; s.input.value = state[k]; s.out.textContent = fmt(state[k], s.step); });
  colorEls.forEach((el, i) => el.value = state.colors[i]);
  $("palette").value = state.palette;
  $("seed").value = state.seed;
  $("w").value = state.w; $("h").value = state.h;
}

$("palette").addEventListener("change", e => {
  if (PALETTES[e.target.value]) { state.palette = e.target.value; state.colors = [...PALETTES[state.palette]]; syncUI(); schedule(); }
});
$("seed").addEventListener("input", e => { state.seed = (+e.target.value) | 0; schedule(); });
$("newSeed").addEventListener("click", () => { state.seed = (Math.random() * 1e6) | 0; syncUI(); schedule(); });
$("preset").addEventListener("change", e => {
  if (e.target.value === "custom") return;
  const [w, h] = e.target.value.split("x").map(Number); state.w = w; state.h = h; syncUI(); schedule();
});
["w", "h"].forEach(id => $(id).addEventListener("change", e => {
  state[id] = Math.max(64, Math.min(8192, (+e.target.value) | 0)); $("preset").value = "custom"; syncUI(); schedule();
}));

function randomize() {
  const r = Math.random, lerp = (a, b) => a + (b - a) * r();
  state.seed = (r() * 1e6) | 0;
  const names = Object.keys(PALETTES);
  state.palette = names[(r() * names.length) | 0];
  state.colors = [...PALETTES[state.palette]];
  Object.assign(state, {
    cells: Math.round(lerp(14, 60)), irregular: lerp(0.5, 1), relief: lerp(0.3, 0.9), tilt: lerp(0.25, 0.8),
    gap: lerp(0.1, 0.5), sheen: lerp(0.3, 0.8), shadow: lerp(0.4, 0.85), light: Math.round(lerp(30, 150)),
    density: lerp(0.25, 0.6), angle: Math.round(lerp(-70, -20) * (r() < 0.75 ? 1 : -1)), bands: 1 + (r() * 3 | 0),
    spread: lerp(0.15, 0.6), size: lerp(0.25, 0.65), opacity: lerp(0.6, 0.95), detail: lerp(0.2, 0.8), glow: lerp(0.1, 0.6),
  });
  syncUI(); schedule();
}
$("randomize").addEventListener("click", randomize);

function download() {
  const out = document.createElement("canvas");
  out.width = state.w; out.height = state.h;
  render(out.getContext("2d"), state.w, state.h);
  out.toBlob(blob => saveImage(blob, `fluffee-tiles-${state.palette.toLowerCase().replace(/\s+/g, "-")}-${state.seed}-${state.w}x${state.h}.png`), "image/png");
}
$("download").addEventListener("click", download);

window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.code === "Space") { e.preventDefault(); randomize(); }
  else if (e.key === "s") download();
});
window.addEventListener("resize", schedule);

[state.w, state.h] = setupDevicePreset($("preset"));
syncUI(); draw();
</script>
</body>
</html>
