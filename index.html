<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluffee Wallpapers</title>
<style>
  :root { --bg:#111117; --panel:#1b1b24; --line:#2c2c3a; --text:#e8e6f0; --dim:#9a97ab; --accent:#c86bff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display:flex; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; min-width:0; }
  #c { max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 20px 60px #0008; background:#000; }
  aside { width:300px; flex:none; background:var(--panel); border-left:1px solid var(--line);
    overflow-y:auto; padding:18px 18px 28px; }
  .tabs { display:flex; gap:4px; background:#12121a; border:1px solid var(--line); border-radius:8px; padding:3px; margin-bottom:14px; }
  .tabs a { flex:1; text-align:center; padding:5px 0; border-radius:6px; color:var(--dim); text-decoration:none; }
  .tabs a.on { background:#2a2a38; color:var(--text); }
  h1 { font-size:16px; margin:0 0 4px; letter-spacing:.3px; }
  .sub { color:var(--dim); margin:0 0 16px; font-size:12px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim);
    margin:20px 0 8px; font-weight:600; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .row label { flex:0 0 92px; color:var(--dim); }
  .row input[type=range] { flex:1; accent-color:var(--accent); min-width:0; }
  .row output { width:36px; text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px; }
  select, input[type=number], input[type=text] { background:#12121a; color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:5px 7px; font:inherit; min-width:0; }
  select { flex:1; }
  button { background:#262633; color:var(--text); border:1px solid var(--line); border-radius:7px;
    padding:7px 10px; font:inherit; cursor:pointer; }
  button:hover { background:#30303f; }
  button.primary { background:linear-gradient(90deg,#ff5f8f,#8a6bff); border:none; font-weight:600; }
  button.primary:hover { filter:brightness(1.1); }
  .btns { display:flex; gap:8px; }
  .btns button { flex:1; }
  .swatches { display:flex; gap:6px; }
  .swatches input[type=color] { flex:1; height:30px; padding:0; border:1px solid var(--line);
    border-radius:6px; background:none; cursor:pointer; min-width:0; }
  .res { display:flex; gap:6px; align-items:center; }
  .res input { width:76px; }
  .check { display:flex; align-items:center; gap:8px; margin:8px 0; color:var(--dim); }
  .hint { color:var(--dim); font-size:11px; margin-top:6px; }
</style>
<meta name="theme-color" content="#111117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wallpapers">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<aside>
  <div class="tabs"><a href="index.html" class="on">〰 Waves</a><a href="shards.html">◆ Shards</a><a href="tiles.html">⬢ Tiles</a></div>
  <h1>Fluffee Wallpapers</h1>
  <p class="sub">Silky wave &amp; gradient wallpaper generator</p>

  <div class="btns">
    <button class="primary" id="randomize">🎲 Randomize</button>
    <button id="download">⬇ Save PNG</button>
  </div>
  <div class="row" style="margin-top:10px">
    <label>Seed</label>
    <input type="number" id="seed" style="flex:1">
    <button id="newSeed" title="New seed, keep everything else">↻</button>
  </div>

  <h2>Colors</h2>
  <div class="row">
    <label>Palette</label>
    <select id="palette"></select>
  </div>
  <div class="swatches" id="swatches"></div>
  <div class="hint">Glow · Sky · Wave A · Wave B · Wave C</div>

  <h2>Waves</h2>
  <div id="sliders"></div>

  <h2>Output</h2>
  <div class="row">
    <label>Size</label>
    <select id="preset">
      <option value="1920x1080">1920 × 1080 (FHD)</option>
      <option value="2560x1440">2560 × 1440 (QHD)</option>
      <option value="3840x2160">3840 × 2160 (4K)</option>
      <option value="3440x1440">3440 × 1440 (Ultrawide)</option>
      <option value="5120x2880">5120 × 2880 (5K)</option>
      <option value="1170x2532">1170 × 2532 (Phone)</option>
      <option value="1440x3200">1440 × 3200 (Phone tall)</option>
      <option value="2048x2048">2048 × 2048 (Square)</option>
      <option value="custom">Custom…</option>
    </select>
  </div>
  <div class="res">
    <input type="number" id="w" min="64" max="8192"> ×
    <input type="number" id="h" min="64" max="8192">
  </div>
  <label class="check"><input type="checkbox" id="animate"> Animate preview</label>
  <div class="hint keys">Shortcuts: <b>Space</b> randomize · <b>S</b> save · <b>A</b> animate</div>
</aside>

<script src="pwa.js"></script>
<script>
// ---------- Palettes: [glow, sky, waveA, waveB, waveC] ----------
const PALETTES = {
  "Cotton Candy": ["#ffd59e", "#3b3566", "#ff4f8b", "#c26bff", "#3f7bff"],
  "Sunset":       ["#ffe2a8", "#5a2d5e", "#ff7a59", "#ff3d7f", "#7b3fe4"],
  "Ocean":        ["#bff4ff", "#0b1d3a", "#2ee6d6", "#1f8fff", "#3a3bd1"],
  "Aurora":       ["#c6ffdd", "#0d1530", "#30e3a0", "#2bb7ff", "#9b5cff"],
  "Peach Milk":   ["#fff3e4", "#e8b4a8", "#ffb38a", "#ff8fa3", "#d78cff"],
  "Lavender":     ["#f7eaff", "#5b4a8a", "#e0a8ff", "#a78bfa", "#6d7cff"],
  "Midnight":     ["#7a5cff", "#05050c", "#3a1c71", "#d76d77", "#2b2bd6"],
  "Neon":         ["#ffffff", "#0a0014", "#ff00c8", "#7a00ff", "#00e5ff"],
  "Forest":       ["#f2ffd6", "#0f2a1f", "#a8e063", "#2fb67c", "#136a6a"],
  "Mono Silk":    ["#ffffff", "#1a1a1f", "#d9d9e3", "#8e8ea0", "#3b3b4a"],
};

const SLIDERS = [
  ["layers",    "Layers",      3, 12, 1,    6],
  ["amplitude", "Amplitude",   0, 1,  0.01, 0.7],
  ["frequency", "Frequency",   0.2, 3, 0.01, 0.75],
  ["tilt",      "Tilt",       -1, 1,  0.01, 0.15],
  ["spread",    "Spread",      0.2, 1, 0.01, 0.75],
  ["roll",      "Roundness",   0, 1,  0.01, 0.6],
  ["sheen",     "Sheen",       0, 1,  0.01, 0.5],
  ["satin",     "Satin lines", 0, 1,  0.01, 0.2],
  ["shadow",    "Shadows",     0, 1,  0.01, 0.6],
  ["depth",     "Depth blur",  0, 1,  0.01, 0.45],
  ["haze",      "Haze",        0, 1,  0.01, 0.35],
  ["light",     "Light angle", 0, 360, 1,   125],
  ["hueShift",  "Color flow",  0, 1,  0.01, 0.5],
  ["grain",     "Grain",       0, 1,  0.01, 0.25],
];

const state = { seed: 1, palette: "Cotton Candy", colors: [...PALETTES["Cotton Candy"]], w: 3840, h: 2160, animate: false };
SLIDERS.forEach(([k,,,,,v]) => state[k] = v);

// ---------- Seeded RNG ----------
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- WebGL ----------
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
if (!gl) document.body.innerHTML = "<p style='padding:40px'>WebGL is not available in this browser.</p>";

const MAX_LAYERS = 12;
const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const fs = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform int uLayers;
uniform vec4 uP[${MAX_LAYERS}];   // per layer: phase1, phase2, freqMul, colorOffset
uniform vec4 uQ[${MAX_LAYERS}];   // per layer: phase3, ampMul, baseJitter, speed
uniform vec3 uC[5];
uniform float uAmp, uFreq, uTilt, uSpread, uRoll, uSheen, uSatin, uShadow, uDepth, uHaze, uLight, uHue, uGrain;

float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }

vec3 wave3(float t){                       // gradient across the three wave colors
  t = clamp(t, 0., 1.);
  return t < .5 ? mix(uC[2], uC[3], smoothstep(0.,1.,t*2.)) : mix(uC[3], uC[4], smoothstep(0.,1.,t*2.-1.));
}

vec3 background(vec2 uv, float aspect){
  vec2 g = vec2(0.0, 1.05);                // glow source, top-left
  float d = length((uv - g) * vec2(aspect*0.55, 1.0));
  vec3 sky = mix(uC[1], mix(uC[1], uC[3], 0.35), uv.x*0.4);
  vec3 col = mix(uC[0], sky, smoothstep(0.0, 1.15, d));
  return col;
}

float curve(vec4 p, vec4 q, float x, float fi, float n){
  float k = fi / max(n - 1., 1.);          // 0 = back, 1 = front
  float top = 0.5 + uSpread * 0.45, bottom = 0.5 - uSpread * 0.55;
  float base = mix(top, bottom, k) + q.z * 0.06 + uTilt * (x - 0.5) * 0.5 * (1. - 0.4*k);
  float f = uFreq * p.z * 6.2831;
  float t = uTime * q.w;
  float a = uAmp * 0.14 * q.y;
  float y = 0.62*sin(x*f + p.x + t)
          + 0.28*sin(x*f*1.93 + p.y - t*0.7)
          + 0.10*sin(x*f*3.71 + q.x + t*1.3);
  return base + a * y;
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float aspect = uRes.x / uRes.y;
  float px = 1.0 / uRes.y;
  float x = uv.x * aspect / 1.7778;        // keep wave shapes consistent across aspect ratios
  float y = uv.y;

  vec3 bg = background(uv, aspect);
  vec3 col = bg;
  float n = float(uLayers);
  float la = radians(uLight);
  vec3 L = normalize(vec3(cos(la), sin(la), 0.9));
  float roll = mix(0.012, 0.09, uRoll);

  for (int i = 0; i < ${MAX_LAYERS}; i++){
    if (i >= uLayers) break;
    float fi = float(i);
    float k = fi / max(n - 1., 1.);
    vec4 P = uP[i], Q = uQ[i];
    float c = curve(P, Q, x, fi, n);
    float e = 0.002;
    float slope = (curve(P, Q, x + e, fi, n) - curve(P, Q, x - e, fi, n)) / (2.*e) * (aspect/1.7778);
    float d = c - y;                       // >0 inside the ribbon (below its crest)

    // soft edge; back layers are blurrier (depth of field)
    float blur = px * (1.2 + uDepth * 28.0 * pow(1. - k, 1.6));
    float a = smoothstep(-blur, blur, d);

    // ambient occlusion: the ribbon darkens what lies just above its crest
    float ao = uShadow * 0.55 * exp(min(d, 0.) / (roll * 1.6 + 0.02));
    col *= 1. - ao * (1. - a);

    // 3D-ish normal: rolled crest facing up, flattening towards the viewer deeper down
    float t = max(d, 0.);
    float r = exp(-t / roll);
    vec3 N = normalize(vec3(-slope * 0.9 * r - slope*0.25, r * 1.4 - 0.35, 1.0));
    float diff = max(dot(N, L), 0.);
    vec3 H = normalize(L + vec3(0., 0., 1.));
    float spec = pow(max(dot(N, H), 0.), 18.) * uSheen * 0.55;
    float rim = pow(r, 3.0) * uSheen * 0.5;

    float ct = x * (0.35 + uHue * 0.9) + k * 0.55 + P.w * 0.35 - 0.2 - t * 1.5;
    vec3 base = wave3(ct);
    vec3 lc = base * (0.42 + 0.75 * diff);
    // satin streaks running parallel to the crest
    float s = pow(0.5 + 0.5 * sin(t * 260. + slope * 2. + P.x), 6.) * exp(-t / (roll * 3.));
    lc += (base * 0.6 + 0.4) * s * uSatin * 0.18;
    lc += mix(base, uC[0], 0.7) * (spec * 0.9 + rim * 0.7);
    lc *= 1. - 0.35 * smoothstep(0., 0.35, t) * (1. - diff);   // fall-off deep inside

    // atmospheric haze for distant layers
    lc = mix(lc, bg, uHaze * 0.7 * pow(1. - k, 1.3));

    col = mix(col, lc, a);
  }

  // gentle vignette + grain (also kills banding)
  vec2 v = uv - 0.5;
  col *= 1. - 0.25 * dot(v, v);
  col += (hash(gl_FragCoord.xy + fract(uTime)) - 0.5) * (0.004 + uGrain * 0.06);
  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = name => gl.getUniformLocation(prog, name);

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n>>16&255)/255, (n>>8&255)/255, (n&255)/255]; }

function render(w, h, time) {
  canvas.width = w; canvas.height = h;
  gl.viewport(0, 0, w, h);
  const rnd = mulberry32(state.seed);
  const P = [], Q = [];
  for (let i = 0; i < MAX_LAYERS; i++) {
    P.push(rnd()*6.283, rnd()*6.283, 0.7 + rnd()*0.7, rnd());
    Q.push(rnd()*6.283, 0.45 + rnd()*1.1, rnd()*2-1, (0.15 + rnd()*0.25) * (rnd()<.5?-1:1));
  }
  gl.uniform2f(U("uRes"), w, h);
  gl.uniform1f(U("uTime"), time);
  gl.uniform1i(U("uLayers"), state.layers);
  gl.uniform4fv(U("uP"), P);
  gl.uniform4fv(U("uQ"), Q);
  gl.uniform3fv(U("uC"), state.colors.flatMap(hexToRgb));
  const map = { amplitude:"uAmp", frequency:"uFreq", tilt:"uTilt", spread:"uSpread", roll:"uRoll", sheen:"uSheen",
    satin:"uSatin", shadow:"uShadow", depth:"uDepth", haze:"uHaze", light:"uLight", hueShift:"uHue", grain:"uGrain" };
  for (const k in map) gl.uniform1f(U(map[k]), state[k]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// Preview renders at screen resolution with the output's aspect ratio
let time = 0;
function previewSize() {
  const stage = document.getElementById("stage");
  const [maxW, maxH] = stageBox(stage);
  const s = Math.min(maxW / state.w, maxH / state.h);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = Math.round(state.w * s) + "px";
  canvas.style.height = Math.round(state.h * s) + "px";
  return [Math.max(1, Math.round(state.w * s * dpr)), Math.max(1, Math.round(state.h * s * dpr))];
}
function draw() { const [w, h] = previewSize(); render(w, h, time); }

let last = 0;
function loop(ts) {
  if (state.animate) { time += Math.min((ts - last) / 1000, 0.05); draw(); }
  last = ts; requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- UI ----------
const $ = id => document.getElementById(id);
const sliderEls = {};
SLIDERS.forEach(([key, label, min, max, step]) => {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}"><output></output>`;
  const input = row.querySelector("input"), out = row.querySelector("output");
  input.addEventListener("input", () => { state[key] = +input.value; out.textContent = fmt(+input.value, step); draw(); });
  sliderEls[key] = { input, out, step };
  $("sliders").appendChild(row);
});
const fmt = (v, step) => step >= 1 ? String(Math.round(v)) : v.toFixed(2);

Object.keys(PALETTES).forEach(name => $("palette").add(new Option(name, name)));
$("palette").add(new Option("Custom", "Custom"));
const colorEls = state.colors.map((_, i) => {
  const el = document.createElement("input"); el.type = "color";
  el.addEventListener("input", () => { state.colors[i] = el.value; state.palette = "Custom"; $("palette").value = "Custom"; draw(); });
  $("swatches").appendChild(el); return el;
});

function syncUI() {
  SLIDERS.forEach(([k]) => { const s = sliderEls[k]; s.input.value = state[k]; s.out.textContent = fmt(state[k], s.step); });
  colorEls.forEach((el, i) => el.value = state.colors[i]);
  $("palette").value = state.palette;
  $("seed").value = state.seed;
  $("w").value = state.w; $("h").value = state.h;
  $("animate").checked = state.animate;
}

$("palette").addEventListener("change", e => {
  if (PALETTES[e.target.value]) { state.palette = e.target.value; state.colors = [...PALETTES[state.palette]]; syncUI(); draw(); }
});
$("seed").addEventListener("input", e => { state.seed = (+e.target.value) | 0; draw(); });
$("newSeed").addEventListener("click", () => { state.seed = (Math.random() * 1e6) | 0; syncUI(); draw(); });
$("preset").addEventListener("change", e => {
  if (e.target.value === "custom") return;
  const [w, h] = e.target.value.split("x").map(Number); state.w = w; state.h = h; syncUI(); draw();
});
["w", "h"].forEach(id => $(id).addEventListener("change", e => {
  state[id] = Math.max(64, Math.min(8192, (+e.target.value) | 0)); $("preset").value = "custom"; syncUI(); draw();
}));
$("animate").addEventListener("change", e => state.animate = e.target.checked);

function randomize() {
  const r = Math.random, lerp = (a, b) => a + (b - a) * r();
  state.seed = (r() * 1e6) | 0;
  const names = Object.keys(PALETTES);
  state.palette = names[(r() * names.length) | 0];
  state.colors = [...PALETTES[state.palette]];
  Object.assign(state, {
    layers: 4 + ((r() * 6) | 0), amplitude: lerp(0.35, 0.9), frequency: lerp(0.4, 1.25), tilt: lerp(-0.6, 0.6),
    spread: lerp(0.5, 0.95), roll: lerp(0.25, 0.85), sheen: lerp(0.3, 0.8), satin: lerp(0.1, 0.6),
    shadow: lerp(0.35, 0.8), depth: lerp(0.2, 0.7), haze: lerp(0.15, 0.55), light: Math.round(lerp(90, 160)), hueShift: lerp(0.2, 0.9),
  });
  syncUI(); draw();
}
$("randomize").addEventListener("click", randomize);

function download() {
  render(state.w, state.h, time);
  canvas.toBlob(blob => {
    saveImage(blob, `fluffee-${state.palette.toLowerCase().replace(/\s+/g, "-")}-${state.seed}-${state.w}x${state.h}.png`);
    draw();
  }, "image/png");
}
$("download").addEventListener("click", download);

window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range" && e.target.type !== "checkbox") return;
  if (e.code === "Space") { e.preventDefault(); randomize(); }
  else if (e.key === "s") download();
  else if (e.key === "a") { state.animate = !state.animate; syncUI(); }
});
window.addEventListener("resize", draw);

[state.w, state.h] = setupDevicePreset($("preset"));
syncUI(); draw();
</script>
</body>
</html>
