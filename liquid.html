<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluffee Wallpapers · Liquid</title>
<link rel="stylesheet" href="studio.css">
<style>:root { --accent:#ff3b55; }</style>
<meta name="theme-color" content="#111117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wallpapers">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<aside><div class="tabs"></div></aside>

<script src="pwa.js"></script>
<script src="studio.js"></script>
<script>
// Glossy molten ribbons: a domain-warped stripe field shaded as a wet, reflective height map,
// with an inner glow that lights up some regions of the flow.
const FS = `
precision highp float;
uniform vec2 uRes;
uniform vec4 uSeed[3];
uniform vec3 uC[5];              // background, body, glow, hot, highlight
uniform float uLayers, uScale, uWarp, uBands, uAngle, uTwist, uWidth, uDepth, uGloss, uGlow, uCover, uRim, uLight, uGrain;
${Studio.GLSL_NOISE}
float fbm2(vec2 p){ return .65 * vnoise(p) + .35 * vnoise(p * 2.03 + 17.1); }   // smooth, low-detail noise

vec2 dir;
// Warped stripe coordinate: every integer step is one ribbon. w returns a slow noise used for tapering.
float stripe(vec2 uv, vec4 sd, float bands, out float w){
  vec2 p = uv * uScale + sd.xy;
  vec2 a = vec2(fbm2(p), fbm2(p + sd.zw));
  vec2 b = vec2(fbm2(p + 1.6 * a + vec2(1.7, 9.2)), fbm2(p + 1.6 * a + vec2(8.3, 2.8)));
  vec2 q = uv + uWarp * 1.6 * (b - .5) + uWarp * .7 * (a - .5);
  w = b.y;
  return dot(q, dir) * bands + uTwist * 5. * (a.y - .5);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - .5 * uRes) / uRes.y;
  float ar = radians(uAngle);
  dir = vec2(cos(ar), sin(ar));
  float la = radians(uLight);
  vec3 L = normalize(vec3(cos(la), sin(la), .8));
  vec3 Hv = normalize(L + vec3(0., 0., 1.));

  vec2 vv = gl_FragCoord.xy / uRes - .5;
  vec3 bg = uC[0] * (1.15 - .6 * dot(vv, vv)) + uC[1] * .12 * (1. - length(vv));
  vec3 col = bg;
  float e = .0015;

  for (int i = 0; i < 3; i++){
    if (float(i) >= uLayers) break;
    float k = uLayers > 1. ? float(i) / (uLayers - 1.) : 1.;     // 0 = back, 1 = front
    vec4 sd = uSeed[i];
    float bands = uBands * (1.25 - .35 * k);
    float w, w2;
    float s = stripe(uv, sd, bands, w);
    vec2 gs = vec2(stripe(uv + vec2(e, 0.), sd, bands, w2) - s, stripe(uv + vec2(0., e), sd, bands, w2) - s) / e;
    vec2 gdir = normalize(gs + 1e-6);
    float id = floor(s), f = fract(s);
    float width = clamp(uWidth * (.45 + 1.1 * w), .06, .97);
    float x = (f - .5) / (width * .5);                    // -1..1 across the ribbon
    float ax = abs(x);
    float aa = length(gs) / uRes.y / (width * .5) * 1.5;
    float alpha = 1. - smoothstep(1. - aa, 1., ax);

    // contact shadow cast on whatever lies behind
    col *= 1. - .75 * exp(-max(ax - 1., 0.) * 2.5) * (1. - alpha) * smoothstep(0., .3, k + .3);

    if (alpha <= 0.) continue;
    float xc = min(ax, .999);
    vec3 N = normalize(vec3(gdir * x, sqrt(1. - xc * xc) * mix(2.6, .55, uDepth)));
    float diff = max(dot(N, L), 0.);
    float spec = pow(max(dot(N, Hv), 0.), mix(16., 160., uGloss));
    float fres = pow(1. - N.z, 3.);

    float rh = hash(vec2(id * 1.37 + float(i) * 7.1, sd.x));
    float glows = step(rh, uCover) * uGlow;
    float core = pow(1. - xc * xc, 1.5);
    vec3 emit = mix(uC[2], uC[3], core * smoothstep(.35, .8, w) * .9);
    vec3 dark = uC[1] * (.18 + .95 * diff);
    vec3 rc = mix(dark, emit * (.3 + .55 * core + .45 * diff), glows);

    vec3 hl = mix(uC[4], mix(uC[3], vec3(1.), .4), glows);
    rc += hl * spec * (.3 + 1.1 * uGloss);
    rc += mix(uC[4], uC[2], .55) * fres * uRim * 1.3;
    rc = mix(rc, bg, (1. - k) * .45);                      // depth haze on back layers
    col = mix(col, rc, alpha);
  }

  col = mix(col, uC[0], smoothstep(.3, 1., dot(vv, vv) * 2.2) * .6);
  col += (hash(gl_FragCoord.xy) - .5) * (.006 + uGrain * .06);
  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

Studio.create({
  file: "liquid",
  sub: "Glossy molten ribbons with an inner glow",
  colorHint: "Background · Body · Glow · Hot · Highlight",
  seed: 7,
  palettes: {
    "Crimson":   ["#04050a", "#18203a", "#e3112e", "#ff5a26", "#8ea8e0"],
    "Cobalt":    ["#03050b", "#121c36", "#1f6dff", "#38e1ff", "#c0d4ff"],
    "Amethyst":  ["#06040b", "#1d1733", "#9b3dff", "#ff4fd8", "#c9b8ff"],
    "Toxic":     ["#030705", "#11221c", "#20e070", "#d4ff3a", "#a8e8cf"],
    "Molten":    ["#070403", "#241815", "#ff4d0d", "#ffc02e", "#ffd9b8"],
    "Rose Gold": ["#0a0607", "#2c1d20", "#ff7a8a", "#ffd0a0", "#ffe4dc"],
    "Teal":      ["#020809", "#0f2428", "#10b8b0", "#7cffd9", "#bfe9ff"],
    "Obsidian":  ["#020203", "#1a1b21", "#5a5f6e", "#a6adbf", "#e8ecf5"],
  },
  groups: [
    ["Flow", [
      ["layers", "Layers",      1, 3, 1,      3],
      ["bands",  "Ribbons",     0.5, 6, 0.01, 1.8],
      ["width",  "Thickness",   0.1, 1, 0.01, 0.55],
      ["angle",  "Direction",   -90, 90, 1,   25],
      ["scale",  "Swirl size",  0.3, 3, 0.01, 0.9],
      ["warp",   "Warp",        0, 1, 0.01,   0.7],
      ["twist",  "Twist",       0, 1, 0.01,   0.4],
    ]],
    ["Surface", [
      ["depth",  "Roundness",   0, 1, 0.01,   0.55],
      ["gloss",  "Gloss",       0, 1, 0.01,   0.6],
      ["rim",    "Rim light",   0, 1, 0.01,   0.5],
      ["glow",   "Glow",        0, 1, 0.01,   0.9],
      ["cover",  "Glowing",     0, 1, 0.01,   0.45],
      ["light",  "Light angle", 0, 360, 1,    115],
      ["grain",  "Grain",       0, 1, 0.01,   0.2],
    ]],
  ],
  webgl: true,
  init(gl) {
    const U = Studio.glProgram(gl, FS);
    const map = { layers: "uLayers", scale: "uScale", warp: "uWarp", bands: "uBands", angle: "uAngle", twist: "uTwist", width: "uWidth",
      depth: "uDepth", gloss: "uGloss", glow: "uGlow", cover: "uCover", rim: "uRim", light: "uLight", grain: "uGrain" };
    return (W, H, S) => {
      const rnd = Studio.rng(S.seed);
      gl.uniform2f(U("uRes"), W, H);
      gl.uniform4fv(U("uSeed"), Array.from({ length: 12 }, () => rnd() * 40));
      gl.uniform3fv(U("uC"), S.colors.flatMap(c => Studio.hexToRgb(c).map(v => v / 255)));
      for (const k in map) gl.uniform1f(U(map[k]), S[k]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
  },
  randomize: lerp => ({
    layers: lerp(2, 3.99), bands: lerp(1, 3.2), width: lerp(0.35, 0.8), angle: lerp(-70, 70), scale: lerp(0.5, 1.4), warp: lerp(0.45, 1),
    twist: lerp(0.1, 0.7), depth: lerp(0.35, 0.8), gloss: lerp(0.4, 0.85), rim: lerp(0.3, 0.7), glow: lerp(0.6, 1), cover: lerp(0.25, 0.65),
    light: lerp(60, 150),
  }),
});
</script>
</body>
</html>
