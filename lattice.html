<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluffee Wallpapers · Lattice</title>
<link rel="stylesheet" href="studio.css">
<style>:root { --accent:#8a93a6; }</style>
<meta name="theme-color" content="#111117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wallpapers">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<aside><div class="tabs"></div></aside>

<script src="pwa.js"></script>
<script src="studio.js"></script>
<script>
// Stacked paper sheets, each cut into a web of straight struts with rounded openings.
// The openings are the cells between a few long lines; every line leaves a strut of its own width.
const { rng, hexToRgb, mixc, rgba, finish, clipHalf, roundPoly } = Studio;

function areaOf(p) { let a = 0; p.forEach((q, i) => { const r = p[(i + 1) % p.length]; a += q[0] * r[1] - r[0] * q[1]; }); return Math.abs(a) / 2; }
function perimeter(p) { let l = 0; p.forEach((q, i) => { const r = p[(i + 1) % p.length]; l += Math.hypot(r[0] - q[0], r[1] - q[1]); }); return l; }

function layerHoles(rnd, W, H, S, s, k) {
  const D = Math.hypot(W, H), cx = W / 2, cy = H / 2;
  const base = rnd() * Math.PI;
  const ang = base + (rnd() - 0.5) * S.rotation * 1.6;
  const lines = [];
  const n = Math.max(2, Math.round(S.holes * (0.8 + 0.4 * rnd())));
  for (let fam = 0; fam < 2; fam++) {
    const m = fam === 0 ? Math.ceil(n / 2) : Math.floor(n / 2);
    const fa = ang + fam * (Math.PI / 2 + (rnd() - 0.5) * S.irregular * 0.8);
    for (let i = 0; i < m; i++) {
      const a = fa + (rnd() - 0.5) * S.irregular * 0.9;
      const nrm = [Math.cos(a), Math.sin(a)];
      const off = ((i + 0.5 + (rnd() - 0.5) * S.irregular * 0.9) / m - 0.5) * D * (1.05 + 0.2 * rnd());
      const w = (5 + 55 * S.strut) * s * (0.45 + 1.1 * rnd());
      lines.push({ n: nrm, c: nrm[0] * cx + nrm[1] * cy + off, w });
    }
  }
  let cells = [[[-0.1 * W, -0.1 * H], [1.1 * W, -0.1 * H], [1.1 * W, 1.1 * H], [-0.1 * W, 1.1 * H]]];
  for (const l of lines) {
    const next = [];
    for (const p of cells) {
      const a = clipHalf(p, l.n, l.c - l.w / 2), b = clipHalf(p, [-l.n[0], -l.n[1]], -l.c - l.w / 2);
      if (a.length >= 3) next.push(a);
      if (b.length >= 3) next.push(b);
    }
    cells = next;
  }
  const minA = (12 * s) ** 2;
  return cells.filter(p => areaOf(p) > minA).map(p => ({ p, r: S.radius * 2 * areaOf(p) / perimeter(p) }));
}

function render(ctx, W, H, S) {
  const rnd = rng(S.seed);
  const [base, sheet, rim] = S.colors.map(hexToRgb);
  const s = Math.sqrt(W * H) / 1440;
  const la = S.light * Math.PI / 180, L2 = [Math.cos(la), -Math.sin(la)];

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.filter = "none";
  ctx.fillStyle = rgba(base); ctx.fillRect(0, 0, W, H);

  const n = S.layers;
  for (let k = 0; k < n; k++) {
    const holes = layerHoles(rnd, W, H, S, s, k);
    const holePath = (dx = 0, dy = 0) => { const p = new Path2D(); holes.forEach(h => roundPoly(p, h.p, h.r, dx, dy)); return p; };
    const sheetPath = new Path2D();
    sheetPath.rect(-W, -H, W * 3, H * 3);
    sheetPath.addPath(holePath());
    const depth = (k + 1) / n;                 // top sheets sit closer to the light
    const tone = mixc(base, sheet, 0.45 + 0.55 * depth);

    // Sheet with a soft shadow cast through its openings onto the sheet below
    ctx.save();
    const off = (4 + 22 * S.shadow) * s;
    ctx.shadowColor = rgba([0, 0, 0], 0.55 + 0.4 * S.shadow);
    ctx.shadowBlur = (6 + 50 * S.shadow) * s;
    ctx.shadowOffsetX = -L2[0] * off; ctx.shadowOffsetY = -L2[1] * off;
    ctx.fillStyle = rgba(tone);
    ctx.fill(sheetPath, "evenodd");
    ctx.restore();

    ctx.save();
    ctx.clip(sheetPath, "evenodd");
    // Gentle light gradient across the sheet
    const g = ctx.createLinearGradient(W / 2 + L2[0] * W * 0.6, H / 2 + L2[1] * H * 0.6, W / 2 - L2[0] * W * 0.6, H / 2 - L2[1] * H * 0.6);
    g.addColorStop(0, rgba(rim, 0.07)); g.addColorStop(1, rgba([0, 0, 0], 0.18));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // Cut edges: walls facing the light catch a thin highlight, the others fall into shade
    const d = (1 + 2.5 * S.rimw) * s;
    ctx.fillStyle = rgba([0, 0, 0], 0.5); ctx.fill(holePath(L2[0] * d, L2[1] * d));
    ctx.fillStyle = rgba(rim, 0.15 + 0.7 * S.rim); ctx.fill(holePath(-L2[0] * d, -L2[1] * d));
    ctx.restore();
    ctx.lineWidth = Math.max(1, s); ctx.strokeStyle = rgba(rim, 0.06 + 0.1 * S.rim); ctx.stroke(holePath());
  }
  finish(ctx, W, H, 0.45, S.grain);
}

Studio.create({
  file: "lattice",
  sub: "Layered paper cut into a web of struts",
  colorHint: "Base · Sheets · Edge light",
  seed: 21,
  palettes: {
    "Onyx":      ["#050506", "#1b1c1f", "#5c616c"],
    "Charcoal":  ["#0a0a0b", "#2a2b2f", "#80858f"],
    "Paper":     ["#8d8f94", "#eceef1", "#ffffff"],
    "Navy":      ["#03050c", "#18213a", "#6c8ad8"],
    "Forest":    ["#030704", "#15261c", "#6fbf8c"],
    "Clay":      ["#140a07", "#5a3326", "#ffb48f"],
    "Gold Rim":  ["#040404", "#17171a", "#ffc84a"],
    "Neon Rim":  ["#040309", "#151321", "#d36bff"],
  },
  groups: [
    ["Cut", [
      ["layers",    "Layers",       1, 5, 1,     3],
      ["holes",     "Struts",       2, 30, 1,    12],
      ["strut",     "Strut width",  0, 1, 0.01,  0.35],
      ["radius",    "Roundness",    0, 1, 0.01,  0.55],
      ["irregular", "Irregularity", 0, 1, 0.01,  0.45],
      ["rotation",  "Layer twist",  0, 1, 0.01,  0.4],
    ]],
    ["Light", [
      ["light",     "Light angle",  0, 360, 1,   120],
      ["shadow",    "Shadows",      0, 1, 0.01,  0.65],
      ["rim",       "Edge light",   0, 1, 0.01,  0.45],
      ["rimw",      "Edge width",   0, 1, 0.01,  0.35],
      ["grain",     "Grain",        0, 1, 0.01,  0.15],
    ]],
  ],
  render,
  randomize: lerp => ({
    layers: lerp(2, 4.99), holes: lerp(6, 20), strut: lerp(0.15, 0.6), radius: lerp(0.3, 0.9), irregular: lerp(0.2, 0.8),
    rotation: lerp(0.1, 0.8), light: lerp(60, 150), shadow: lerp(0.4, 0.9), rim: lerp(0.25, 0.7), rimw: lerp(0.15, 0.6),
  }),
});
</script>
</body>
</html>
